<footer
  class="w-[99%] min-h-[48px] py-2 mt-2 mb-3 flex flex-col sm:flex-row items-center justify-between gap-3 rounded-lg px-3 text-[11px]"
  style="border-top: 1px solid var(--border-primary); background: var(--bg-card); color: var(--text-primary); backdrop-filter: blur(12px);"
>
  <!-- Left Section -->
  <div class="flex flex-wrap items-center justify-center sm:justify-start gap-3 sm:gap-5 text-center sm:text-left">
    <div
      class="flex items-center gap-2 px-3 py-1 rounded-lg"
      style="border: 1px solid var(--border-primary);"
    >
      <app-icon class="footer-icon" name="clock" [size]="16" [strokeWidth]="1.8" variant="inherit" />

      <span class="footer-text">Last Sync</span>
    </div>

    <div class="flex items-center gap-4 footer-text">
      <span>02 June 2026, 12:45 PM</span>
      <span>Version : V1.0</span>
    </div>
  </div>

  <!-- Right Section -->
  <div>
    <span class="footer-text">Copyright @2026 | Content Owned</span>
  </div>
</footer>
