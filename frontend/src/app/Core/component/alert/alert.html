@if (appService.showAlert()) {
<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50">

    <div class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl">

        <h2 class="text-xl font-semibold">
            {{ appService.alertTitle() }}
        </h2>

        <p class="mt-3 text-gray-600">
            {{ appService.alertMessage() }}
        </p>

        <div class="mt-6 flex justify-end">
            <button (click)="appService.closeAlert()" class="rounded-lg bg-blue-600 px-4 py-2 alertbtn text-white">
                OK
            </button>
        </div>

    </div>
</div>
}
