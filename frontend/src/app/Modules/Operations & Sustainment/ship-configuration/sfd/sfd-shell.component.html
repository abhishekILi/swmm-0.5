<div class="sfd-content">
  @switch (activeTab()) {
    @case ("overview") {
      <app-sfd-overview />
    }
    @case ("config") {
      <app-sfd-config />
    }
    @case ("actions") {
      <app-sfd-management />
    }
    @case ("reports") {
      <app-sfd-reports />
    }
    @case ("insights") {
      <app-sfd-insights />
    }
    @case ("sfd-references") {
      <app-sfd-references />
    }
  }
</div>
