<div [formGroup]="form">
  <div [formArrayName]="controlName" class="flex flex-col gap-3">
    <div *ngFor="let ctrl of items.controls; let i = index" class="flex items-start gap-2">
      <textarea
        [formControlName]="i"
        rows="2"
        class="flex-1 resize-none rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF]"
        [placeholder]="placeholder"
      ></textarea>

      <button
        type="button"
        (click)="removeItem(i)"
        class="flex h-8 w-8 items-center justify-center rounded-lg border border-white/20 bg-white/[0.08] text-red-300 transition hover:border-red-400/50 hover:bg-red-500/15"
      >
        −
      </button>
    </div>

    <div class="mt-1 flex justify-end">
      <button
        type="button"
        (click)="addItem()"
        class="flex h-8 w-8 items-center justify-center rounded-lg border border-white/20 bg-white/[0.08] text-white/90 transition hover:border-[#61C2FF]/50 hover:bg-[#61C2FF]/15"
      >
        +
      </button>
    </div>
  </div>
</div>
