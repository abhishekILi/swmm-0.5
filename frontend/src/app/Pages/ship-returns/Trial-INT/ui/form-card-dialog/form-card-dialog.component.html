<div
  *ngIf="open"
  class="pt-glass-dialog-backdrop dialog-overlay fixed inset-0 z-[1000] bg-black/60 backdrop-blur-sm"
  (click)="!isExpanded && onClose()"
></div>

<div
  *ngIf="open"
  class="dialog-container fixed inset-0 z-[1001] flex items-center justify-center p-4 sm:p-6 pointer-events-none"
>
  <div
    class="pt-glass-dialog dialog-card pointer-events-auto flex flex-col overflow-hidden rounded-xl border border-white/10 bg-[#111622] shadow-2xl transition-all duration-300 ease-in-out"
    [class.expanded]="isExpanded"
    [class.w-screen]="isExpanded"
    [class.h-screen]="isExpanded"
    [class.max-w-none]="isExpanded"
    [class.max-h-none]="isExpanded"
    [class.rounded-none]="isExpanded"
    [class.w-full]="!isExpanded"
    [class.max-w-[900px]]="!isExpanded"
    [class.max-h-[85vh]]="!isExpanded"
  >
    <!-- Header -->
    <div class="pt-glass-dialog__header dialog-header flex items-center justify-between border-b border-white/10 px-5 py-4 sm:px-6 bg-white/[0.02]">
      <div>
        <h2 class="dialog-title text-white font-bold text-lg sm:text-xl tracking-wide">{{ title }}</h2>
        <p *ngIf="subtitle" class="dialog-subtitle text-white/70 text-xs sm:text-sm mt-0.5">{{ subtitle }}</p>
      </div>

      <div class="dialog-actions flex items-center gap-2">
        <button
          type="button"
          class="icon-btn flex h-8 w-8 items-center justify-center rounded-lg border border-white/10 bg-white/5 text-white/70 hover:bg-white/10 hover:text-white transition"
          title="Expand"
          (click)="toggleExpand()"
        >
          <span class="text-base leading-none">{{ isExpanded ? '🗗' : '⤢' }}</span>
        </button>

        <button
          type="button"
          class="icon-btn flex h-8 w-8 items-center justify-center rounded-lg border border-white/10 bg-white/5 text-white/70 hover:bg-white/10 hover:text-white transition"
          title="Close"
          (click)="onClose()"
        >
          <span class="text-base leading-none">✕</span>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="pt-glass-dialog__body dialog-body pt-glass-form-shell flex-1 overflow-y-auto p-5 sm:p-6">
      <ng-content></ng-content>
    </div>

    <!-- Footer -->
    <div
      *ngIf="showFooter"
      class="pt-glass-dialog__footer dialog-footer flex items-center justify-end gap-3 border-t border-white/10 px-5 py-4 sm:px-6 bg-white/[0.02]"
    >
      <ng-content select="[formFooter]"></ng-content>

      <ng-container *ngIf="!hasCustomFooter">
        <button
          type="button"
          class="px-5 py-2 rounded-lg border border-white/20 bg-white/5 text-sm font-semibold text-white hover:bg-white/10 transition active:scale-95"
          (click)="onCancel()"
          [disabled]="loading"
        >
          {{ cancelLabel }}
        </button>

        <button
          *ngIf="submitLabel"
          type="button"
          class="px-6 py-2 rounded-lg border border-[#3b82f6]/40 bg-[#1d4ed8] text-sm font-semibold text-white hover:bg-[#1e40af] shadow-md transition active:scale-95 disabled:opacity-50"
          (click)="onSubmit()"
          [disabled]="loading"
        >
          <span *ngIf="!loading">{{ submitLabel }}</span>
          <span *ngIf="loading" class="flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Saving...
          </span>
        </button>
      </ng-container>
    </div>
  </div>
</div>
