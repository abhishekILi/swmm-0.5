<div
  *ngIf="open"
  class="pt-glass-dialog-backdrop dialog-overlay fixed inset-0 z-[1000]"
  (click)="!isExpanded && onClose()"
></div>

<div
  *ngIf="open"
  class="dialog-container fixed inset-0 z-[1001] flex items-center justify-center p-4 sm:p-6 pointer-events-none"
>
  <div
    class="pt-glass-dialog dialog-card pointer-events-auto flex flex-col overflow-hidden rounded-xl border border-[var(--shell-glass-border)] shadow-2xl transition-all duration-300 ease-in-out"
    [class.expanded]="isExpanded"
    [class.w-screen]="isExpanded"
    [class.h-screen]="isExpanded"
    [class.max-w-none]="isExpanded"
    [class.max-h-none]="isExpanded"
    [class.rounded-none]="isExpanded"
    [class.w-full]="!isExpanded"
    [class.max-w-[900px]]="!isExpanded"
    [class.max-h-[85vh]]="!isExpanded"
  >
    <div class="pt-glass-dialog__header dialog-header flex items-start justify-between gap-4 px-5 py-4 sm:px-6">
      <div>
        <h2 class="dialog-title">{{ title }}</h2>
        <p *ngIf="subtitle" class="dialog-subtitle">{{ subtitle }}</p>
      </div>

      <div class="dialog-actions flex items-center gap-2">
        <button
          type="button"
          class="icon-btn flex h-9 w-9 items-center justify-center"
          title="Expand"
          (click)="toggleExpand()"
        >
          <span class="text-xl leading-none">{{ isExpanded ? '🗗' : '⤢' }}</span>
        </button>

        <button
          type="button"
          class="icon-btn flex h-9 w-9 items-center justify-center"
          title="Close"
          (click)="onClose()"
        >
          <span class="text-lg leading-none">✕</span>
        </button>
      </div>
    </div>

    <div class="pt-glass-dialog__body dialog-body pt-glass-form-shell flex-1 overflow-y-auto p-4 sm:p-6">
      <ng-content></ng-content>
    </div>

    <div
      *ngIf="showFooter"
      class="pt-glass-dialog__footer dialog-footer flex items-center justify-end gap-3"
    >
      <ng-content select="[formFooter]"></ng-content>

      <ng-container *ngIf="!hasCustomFooter">
        <app-loading-button
          [label]="cancelLabel"
          color="red"
          [loading]="loading"
          (clicked)="onCancel()"
        />

        <app-loading-button
          *ngIf="submitLabel"
          [label]="submitLabel"
          color="blue"
          [loading]="loading"
          [disabled]="loading"
          (clicked)="onSubmit()"
        />
      </ng-container>
    </div>
  </div>
</div>
