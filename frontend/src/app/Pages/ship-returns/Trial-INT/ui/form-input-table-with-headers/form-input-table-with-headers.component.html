<div class="pt-glass-matrix-wrap w-full relative">
  <table class="pt-glass-matrix table-fixed">
    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <thead>
      <!-- MULTI HEADER -->
      <ng-container *ngIf="headerRows?.length; else normalHeader">
        <tr *ngFor="let headerRow of headerRows; let rowIndex = index">
          <th
            *ngFor="let col of headerRow"
            class="text-center"
            [attr.colspan]="col.colspan || null"
            [attr.rowspan]="col.rowspan || null"
            [style.width]="col.width || 'auto'"
          >
            <span>
              {{ col.header }}

              <span
                *ngIf="isHeaderRequired(col.field, col)"
                class="text-red-400 ml-1"
                >*</span
              >
            </span>
          </th>

          <th
            *ngIf="enableRowActions && rowIndex === 0"
            [attr.rowspan]="headerRows.length"
            class="sticky-action-column text-center align-middle"
            style="min-width: 140px"
          >
            Actions
          </th>
        </tr>
      </ng-container>

      <!-- NORMAL HEADER -->
      <ng-template #normalHeader>
        <tr>
          <th
            *ngFor="let col of visibleColumns"
            class="text-center"
            [style.width]="col.width || 'auto'"
            [style.minWidth]="col.width || 'auto'"
            [style.maxWidth]="col.width || 'auto'"
          >
            <span>
              {{ col.header }}

              <span
                *ngIf="isHeaderRequired(col.field)"
                class="text-red-400 ml-1"
                >*</span
              >
            </span>
          </th>

          <th
            *ngIf="enableRowActions"
            class="sticky-action-column text-center"
            style="min-width: 140px"
          >
            Actions
          </th>
        </tr>
      </ng-template>
    </thead>

    <!-- ===================================================== -->
    <!-- BODY -->
    <!-- ===================================================== -->

    <tbody>
      <tr *ngFor="let row of data; let i = index">
        <!-- COLUMNS -->
        <td
          *ngFor="let col of visibleColumns"
          class="align-middle"
          [style.width]="isFixedWidthColumn(col) ? col.width || 'auto' : null"
          [style.minWidth]="col.width || 'auto'"
          [style.maxWidth]="
            isFixedWidthColumn(col) ? col.width || 'auto' : null
          "
        >
          <!-- NO TEMPLATE -->
          <ng-container *ngIf="!col.template">
            <ng-container [ngSwitch]="col.fieldType">
              <!-- S NO -->
              <!-- <div
                *ngIf="col.field === 's_no'"
                class="flex items-center justify-center font-medium"
              >
                {{ row[col.field] }}
              </div> -->

              <div
                *ngSwitchCase="'serial'"
                class="pt-glass-matrix__label text-center font-semibold"
              >
                {{ row[col.field] }}
              </div>

              <!-- TEXT -->
              <input
                *ngSwitchCase="'text'"
                type="text"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="custom-input w-full"
              />

              <!-- NUMBER -->
              <input
                *ngSwitchCase="'number'"
                type="number"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                [step]="col.step || '1'"
                (input)="handleDecimalInput($event, col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="custom-input w-full"
              />

              <!-- DATE -->
              <input
                *ngSwitchCase="'date'"
                type="date"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                class="custom-input w-full"
              />

              <!-- TIME -->
              <input
                *ngSwitchCase="'time'"
                type="time"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                class="custom-input w-full"
              />

              <!-- TEXTAREA -->
              <textarea
                *ngSwitchCase="'textarea'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                rows="1"
                class="custom-input w-full"
              ></textarea>

              <!-- DROP DOWN -->
              <select
                *ngSwitchCase="'drop-down'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="custom-input w-full"
              >
                <option [ngValue]="null" disabled>Please select</option>

                <option *ngFor="let opt of col.options" [ngValue]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

              <!-- SELECT -->
              <select
                *ngSwitchCase="'select'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="custom-input w-full"
              >
                <option *ngFor="let opt of col.options" [ngValue]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

              <!-- CHECKBOX -->
              <div *ngSwitchCase="'checkbox'" class="flex flex-wrap gap-2">
                <label
                  *ngFor="let opt of col.options"
                  class="flex items-center gap-1 text-sm text-black"
                >
                  <input
                    type="checkbox"
                    [value]="opt.value"
                    [checked]="row[col.field]?.includes(opt.value)"
                    (change)="
                      onCheckboxChange($event, row, col.field, opt.value)
                    "
                  />

                  {{ opt.label }}
                </label>
              </div>

              <!-- COMPOSITE -->
              <ng-container *ngSwitchCase="'composite'">
                <div class="flex flex-col gap-2">
                  <ng-container *ngFor="let sub of col.compositeFields">
                    <ng-container *ngIf="shouldShowSubField(sub, row)">
                      <!-- TEXT -->
                      <input
                        *ngIf="sub.fieldType === 'text'"
                        type="text"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [style.width]="sub.width || '100%'"
                        class="custom-input w-full"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- NUMBER -->
                      <input
                        *ngIf="sub.fieldType === 'number'"
                        type="number"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [step]="sub.step || '1'"
                        [style.width]="sub.width || '100%'"
                        (input)="
                          handleDecimalInput($event, sub, row, sub.field)
                        "
                        class="custom-input w-full"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- DATE -->
                      <input
                        *ngIf="sub.fieldType === 'date'"
                        type="date"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="custom-input w-full"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- TIME -->
                      <input
                        *ngIf="sub.fieldType === 'time'"
                        type="time"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="custom-input w-full"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- TEXTAREA -->
                      <textarea
                        *ngIf="sub.fieldType === 'textarea'"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [style.width]="sub.width || '100%'"
                        rows="2"
                        class="custom-input w-full"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      ></textarea>

                      <!-- DROP DOWN -->
                      <select
                        *ngIf="sub.fieldType === 'drop-down'"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="custom-input w-full"
                      >
                        <option [ngValue]="null" disabled>--Select--</option>

                        <option
                          *ngFor="let opt of sub.options"
                          [ngValue]="opt.value"
                        >
                          {{ opt.label }}
                        </option>
                      </select>

                      <!-- SELECT -->
                      <select
                        *ngIf="sub.fieldType === 'select'"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="custom-input w-full"
                      >
                        <option
                          *ngFor="let opt of sub.options"
                          [ngValue]="opt.value"
                        >
                          {{ opt.label }}
                        </option>
                      </select>
                    </ng-container>
                  </ng-container>
                </div>
              </ng-container>

              <!-- DEFAULT -->
              <span *ngSwitchDefault>
                {{ row[col.field] }}
              </span>
            </ng-container>
          </ng-container>

          <!-- CUSTOM TEMPLATE -->
          <ng-container *ngIf="col.template">
            <ng-container
              *ngTemplateOutlet="
                templates[col.template];
                context: {
                  $implicit: row,
                  index: i,
                  field: col.field,
                }
              "
            ></ng-container>
          </ng-container>
        </td>

        <!-- ACTIONS -->
        <td
          *ngIf="enableRowActions"
          class="sticky-action-column align-middle sticky right-0 z-40"
          style="min-width: 140px"
        >
          <div class="flex items-center justify-center gap-2">
            <!-- ADD -->
            <button
              *ngIf="i === data.length - 1"
              type="button"
              (click)="addRow()"
              [disabled]="data.length >= maxRows || !isRowValid(row)"
              class="w-8 h-8 rounded-full bg-green-100 text-green-700 hover:bg-green-600 hover:text-white transition-colors disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed"
            >
              +
            </button>

            <!-- DELETE -->
            <button
              type="button"
              (click)="deleteRow(i)"
              [disabled]="data.length === 1"
              class="w-8 h-8 rounded-full bg-red-100 text-red-700 hover:bg-red-600 hover:text-white transition-colors disabled:bg-gray-100 disabled:text-gray-400"
            >
              -
            </button>

            <!-- EXTRA ACTIONS -->
            <ng-container *ngFor="let btn of extraActionButtons">
              <button
                *ngIf="checkButtonVisibility(btn, row, i)"
                type="button"
                (click)="onAction(btn.type, row, i)"
                class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white flex items-center justify-center transition-colors"
              >
                <span class="text-xs font-bold" aria-hidden="true">+</span>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
