<div class="w-full relative overflow-x-auto rounded-lg border border-white/15 bg-[#0d2438]">
  <table class="min-w-max w-full border-collapse text-sm text-white/90">
    <!-- ===================================================== -->
    <!-- HEADER -->
    <!-- ===================================================== -->

    <thead>
      <!-- MULTI HEADER -->
      <ng-container *ngIf="headerRows?.length; else normalHeader">
        <tr *ngFor="let headerRow of headerRows; let rowIndex = index">
          <th
            *ngFor="let col of headerRow"
            class="border border-white/15 bg-white/[0.06] px-2 py-2 text-center text-xs font-bold uppercase tracking-wide text-white/70 whitespace-normal break-words leading-tight"
            [attr.colspan]="col.colspan || null"
            [attr.rowspan]="col.rowspan || null"
            [style.width]="col.width || 'auto'"
            [style.minWidth]="col.width || 'auto'"
          >
            <span>
              {{ col.header }}

              <span
                *ngIf="isHeaderRequired(col.field, col)"
                class="text-red-400 ml-1"
                >*</span
              >
            </span>
          </th>

          <th
            *ngIf="enableRowActions && rowIndex === 0"
            [attr.rowspan]="headerRows.length"
            class="sticky right-0 z-10 border border-white/15 bg-[#0d2438] px-3 py-2 text-center align-middle text-xs font-bold uppercase tracking-wide text-white/70"
            style="min-width: 140px"
          >
            Actions
          </th>
        </tr>
      </ng-container>

      <!-- NORMAL HEADER -->
      <ng-template #normalHeader>
        <tr>
          <th
            *ngFor="let col of visibleColumns"
            class="border border-white/15 bg-white/[0.06] px-2 py-2 text-center text-xs font-bold uppercase tracking-wide text-white/70 whitespace-normal break-words leading-tight"
            [style.width]="col.width || 'auto'"
            [style.minWidth]="col.width || 'auto'"
            [style.maxWidth]="col.width || 'auto'"
          >
            <span>
              {{ col.header }}

              <span
                *ngIf="isHeaderRequired(col.field)"
                class="text-red-400 ml-1"
                >*</span
              >
            </span>
          </th>

          <th
            *ngIf="enableRowActions"
            class="sticky right-0 z-10 border border-white/15 bg-[#0d2438] px-3 py-2 text-center text-xs font-bold uppercase tracking-wide text-white/70"
            style="min-width: 140px"
          >
            Actions
          </th>
        </tr>
      </ng-template>
    </thead>

    <!-- ===================================================== -->
    <!-- BODY -->
    <!-- ===================================================== -->

    <tbody>
      <tr *ngFor="let row of data; let i = index" class="even:bg-white/[0.03]">
        <!-- COLUMNS -->
        <td
          *ngFor="let col of visibleColumns"
          class="border border-white/10 px-2 py-2 align-middle"
          [style.width]="isFixedWidthColumn(col) ? col.width || 'auto' : null"
          [style.minWidth]="col.width || 'auto'"
          [style.maxWidth]="
            isFixedWidthColumn(col) ? col.width || 'auto' : null
          "
        >
          <!-- NO TEMPLATE -->
          <ng-container *ngIf="!col.template">
            <ng-container [ngSwitch]="col.fieldType">
              <!-- S NO -->
              <!-- <div
                *ngIf="col.field === 's_no'"
                class="flex items-center justify-center font-medium"
              >
                {{ row[col.field] }}
              </div> -->

              <div
                *ngSwitchCase="'serial'"
                class="text-center font-semibold text-white/90"
              >
                {{ row[col.field] }}
              </div>

              <!-- TEXT -->
              <input
                *ngSwitchCase="'text'"
                type="text"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              />

              <!-- NUMBER -->
              <input
                *ngSwitchCase="'number'"
                type="number"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                [step]="col.step || '1'"
                (input)="handleDecimalInput($event, col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              />

              <!-- DATE -->
              <input
                *ngSwitchCase="'date'"
                type="date"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              />

              <!-- TIME -->
              <input
                *ngSwitchCase="'time'"
                type="time"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              />

              <!-- TEXTAREA -->
              <textarea
                *ngSwitchCase="'textarea'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                rows="1"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              ></textarea>

              <!-- DROP DOWN -->
              <select
                *ngSwitchCase="'drop-down'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              >
                <option [ngValue]="null" disabled>Please select</option>

                <option *ngFor="let opt of col.options" [ngValue]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

              <!-- SELECT -->
              <select
                *ngSwitchCase="'select'"
                [(ngModel)]="row[col.field]"
                [disabled]="isFieldDisabled(col, row)"
                (ngModelChange)="emitValueChange(i, col.field, $event)"
                class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
              >
                <option *ngFor="let opt of col.options" [ngValue]="opt.value">
                  {{ opt.label }}
                </option>
              </select>

              <!-- CHECKBOX -->
              <div *ngSwitchCase="'checkbox'" class="flex flex-wrap gap-2">
                <label
                  *ngFor="let opt of col.options"
                  class="flex items-center gap-1 text-sm text-white/80"
                >
                  <input
                    type="checkbox"
                    [value]="opt.value"
                    [checked]="row[col.field]?.includes(opt.value)"
                    (change)="
                      onCheckboxChange($event, row, col.field, opt.value)
                    "
                  />

                  {{ opt.label }}
                </label>
              </div>

              <!-- COMPOSITE -->
              <ng-container *ngSwitchCase="'composite'">
                <div class="flex flex-col gap-2">
                  <ng-container *ngFor="let sub of col.compositeFields">
                    <ng-container *ngIf="shouldShowSubField(sub, row)">
                      <!-- TEXT -->
                      <input
                        *ngIf="sub.fieldType === 'text'"
                        type="text"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [style.width]="sub.width || '100%'"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- NUMBER -->
                      <input
                        *ngIf="sub.fieldType === 'number'"
                        type="number"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [step]="sub.step || '1'"
                        [style.width]="sub.width || '100%'"
                        (input)="
                          handleDecimalInput($event, sub, row, sub.field)
                        "
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- DATE -->
                      <input
                        *ngIf="sub.fieldType === 'date'"
                        type="date"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- TIME -->
                      <input
                        *ngIf="sub.fieldType === 'time'"
                        type="time"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      />

                      <!-- TEXTAREA -->
                      <textarea
                        *ngIf="sub.fieldType === 'textarea'"
                        [(ngModel)]="row[sub.field]"
                        [placeholder]="sub.placeholder || ''"
                        [style.width]="sub.width || '100%'"
                        rows="2"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                        (ngModelChange)="emitValueChange(i, sub.field, $event)"
                      ></textarea>

                      <!-- DROP DOWN -->
                      <select
                        *ngIf="sub.fieldType === 'drop-down'"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                      >
                        <option [ngValue]="null" disabled>--Select--</option>

                        <option
                          *ngFor="let opt of sub.options"
                          [ngValue]="opt.value"
                        >
                          {{ opt.label }}
                        </option>
                      </select>

                      <!-- SELECT -->
                      <select
                        *ngIf="sub.fieldType === 'select'"
                        [(ngModel)]="row[sub.field]"
                        [style.width]="sub.width || '100%'"
                        class="w-full rounded-md border border-white/20 bg-white/[0.08] px-3 py-2 text-sm text-white placeholder:text-white/40 outline-none transition focus:border-[#61C2FF] disabled:cursor-not-allowed disabled:opacity-50 [color-scheme:dark]"
                      >
                        <option
                          *ngFor="let opt of sub.options"
                          [ngValue]="opt.value"
                        >
                          {{ opt.label }}
                        </option>
                      </select>
                    </ng-container>
                  </ng-container>
                </div>
              </ng-container>

              <!-- DEFAULT -->
              <span *ngSwitchDefault>
                {{ row[col.field] }}
              </span>
            </ng-container>
          </ng-container>

          <!-- CUSTOM TEMPLATE -->
          <ng-container *ngIf="col.template">
            <ng-container
              *ngTemplateOutlet="
                templates[col.template];
                context: {
                  $implicit: row,
                  index: i,
                  field: col.field,
                }
              "
            ></ng-container>
          </ng-container>
        </td>

        <!-- ACTIONS -->
        <td
          *ngIf="enableRowActions"
          class="sticky right-0 z-10 border border-white/10 bg-[#0d2438] align-middle"
          style="min-width: 140px"
        >
          <div class="flex items-center justify-center gap-2">
            <!-- ADD -->
            <button
              *ngIf="i === data.length - 1"
              type="button"
              (click)="addRow()"
              [disabled]="data.length >= maxRows || !isRowValid(row)"
              class="w-8 h-8 rounded-full bg-green-500/15 text-green-300 hover:bg-green-500/30 transition-colors disabled:bg-white/5 disabled:text-white/25 disabled:cursor-not-allowed"
            >
              +
            </button>

            <!-- DELETE -->
            <button
              type="button"
              (click)="deleteRow(i)"
              [disabled]="data.length === 1"
              class="w-8 h-8 rounded-full bg-red-500/15 text-red-300 hover:bg-red-500/30 transition-colors disabled:bg-white/5 disabled:text-white/25 disabled:cursor-not-allowed"
            >
              -
            </button>

            <!-- EXTRA ACTIONS -->
            <ng-container *ngFor="let btn of extraActionButtons">
              <button
                *ngIf="checkButtonVisibility(btn, row, i)"
                type="button"
                (click)="onAction(btn.type, row, i)"
                class="w-8 h-8 rounded-full bg-[#61C2FF]/15 text-[#61C2FF] hover:bg-[#61C2FF]/30 flex items-center justify-center transition-colors"
              >
                <span class="text-xs font-bold" aria-hidden="true">+</span>
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
