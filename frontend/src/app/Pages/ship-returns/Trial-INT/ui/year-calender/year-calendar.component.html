<div class="flex flex-col w-full">

  <label *ngIf="label" class="mb-1.5 text-sm font-medium text-white">
    {{ label }}
  </label>

  <input type="text" [placeholder]="placeholder" [value]="value" [disabled]="disabled" (input)="onInput($event)"
    (keydown)="allowOnlyNumbers($event)" (blur)="markTouched()" class="h-[45px] w-full rounded-[10px] border border-white/40 bg-white/[0.08] px-4 text-sm text-white outline-none transition placeholder:text-white/50 focus:border-white/70 disabled:cursor-not-allowed disabled:opacity-60" />
  <!-- ✅ Error message -->
  <span *ngIf="error" class="text-red-500 text-xs mt-1">
    {{ error }}
  </span>

</div>
