<div class="w-full overflow-hidden rounded-lg border border-white/15 bg-[#0d2438]">
  <div class="flex gap-2 overflow-x-auto border-b border-white/15 p-2">
    <button
      *ngFor="let label of labels; let i = index"
      type="button"
      (click)="setActive(i)"
      class="whitespace-nowrap rounded-md border border-transparent px-5 py-2 text-sm font-medium text-white/70 transition hover:bg-white/10 hover:text-white"
      [class.border-[#4da6ff]]="activeTab === i"
      [class.bg-[#1069AB]]="activeTab === i"
      [class.text-white]="activeTab === i"
    >
      {{ label }}
    </button>
  </div>

  <div class="p-4">
    <div *ngFor="let tpl of templatesArray; let i = index">
      <div [hidden]="activeTab !== i">
        <ng-container *ngTemplateOutlet="tpl"></ng-container>
      </div>
    </div>
  </div>
</div>
