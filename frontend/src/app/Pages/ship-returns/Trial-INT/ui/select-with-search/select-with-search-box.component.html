<div class="relative select-container">
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled"
    class="flex h-[45px] w-full items-center justify-between gap-2 rounded-[10px] border border-white/40 bg-white/[0.08] px-4 text-left text-sm text-white outline-none transition hover:border-white/70 focus:border-white/70"
    [class.cursor-not-allowed]="disabled"
    [class.opacity-50]="disabled"
  >
    <span class="min-w-0 truncate text-white/50" [class.text-white]="value || value === 0">
      {{ selectedLabel }}
    </span>
    <i
      class="fas fa-chevron-down shrink-0 text-[11px] text-white/50 transition-transform"
      [class.rotate-180]="isOpen"
      aria-hidden="true"
    ></i>
  </button>

  <div
    *ngIf="isOpen && !disabled"
    class="absolute z-[100] mt-1 w-full overflow-hidden rounded-md border border-white/20 bg-[#0d2438] text-white shadow-xl"
    role="listbox"
  >
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="filterOptions()"
      placeholder="Search…"
      class="w-full border-0 border-b border-white/15 bg-transparent px-3 py-2 text-sm text-white outline-none placeholder:text-white/50 focus:border-[#61C2FF]"
      (click)="$event.stopPropagation()"
    />

    <button
      *ngFor="let option of filteredOptions"
      type="button"
      class="block w-full px-3 py-2 text-left text-sm text-white/90 transition hover:bg-white/10"
      [class.bg-[#1069AB]]="option.value === value"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>

    <p *ngIf="filteredOptions.length === 0" class="px-3 py-2 text-sm text-white/60">
      No results found
    </p>
  </div>
</div>
