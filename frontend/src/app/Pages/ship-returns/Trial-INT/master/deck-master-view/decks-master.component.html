<div class="p-2 sm:p-3">
    <app-paginate-table
        title="Deck Master"
        description="Manage system ship decks"
        [showHeaderSection]="true"
        [addButtons]="[{ label: 'Add new deck', key: 'add' }]"
        (addButtonClick)="openAddShip()"
        [showImport]="true"
        [showExport]="true"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [tableLoading]="isLoading"
        [showSearch]="true">
    </app-paginate-table>
</div>

<app-decks-master-add *ngIf="isFormOpen" [editMode]="isEditMode" [viewMode]="isViewMode" [unitData]="selectedRow"
    (close)="closeAddForm()" (addNewRequest)="isNewEntryAdded = $event">
</app-decks-master-add>

<app-reusable-delete-dialog [open]="isDeleteDialogOpen" [id]="deleteRow?.id" [name]="deleteRow?.name" entityType="Unit"
    [loading]="isDeleteLoading" (confirm)="confirmDelete()" (cancel)="closeDeleteDialog()">
</app-reusable-delete-dialog>
