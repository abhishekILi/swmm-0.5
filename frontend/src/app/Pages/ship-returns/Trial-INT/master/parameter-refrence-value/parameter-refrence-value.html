<div class="p-2 sm:p-3">
  <app-paginate-table
    #pagination
    [showHeaderSection]="true"
    title="CREATE/SET Parameter Reference Value"
    [showSearch]="true"
    url="/master/overall-vibration-linkage/"
    [columnDefs]="parameterRefData"
    [addButtons]="addButtons"
    [showPagination]="true"
    (addButtonClick)="buttonClick($event)"
  />
</div>

<app-reusable-delete-dialog
  [open]="showDeleteDialog"
  [name]="deleteName"
  entityType="Parameter Reference Value"
  [loading]="deleteLoading"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteDialog()"
/>

<div
  *ngIf="showCreateLayout"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"
  (click)="showCreateLayout = false"
>
  <div class="w-full max-w-[90vw]" (click)="$event.stopPropagation()">
    <app-form-card
      class="block max-h-[calc(100vh-2rem)] overflow-hidden"
      title="CREATE/SET Parameter Reference Value"
    >
      <div class="max-h-[calc(100vh-11rem)] min-h-0 overflow-auto p-3">
        <app-add-form
          #addForm
          class="block"
          [open]="showCreateLayout"
          [formConfig]="formConfig"
          [formData]="editFormData"
          [isShowPopup]="false"
          [isEditMode]="isEditMode"
          [fromTitle]="title"
          (onFieldChange)="handleSelectChange($event)"
        />

        <div
          class="overflow-x-auto"
          *ngFor="let table of overallVibrationConfig.tables; trackBy: trackByTable"
        >
          <div *ngIf="table.title" class="mb-2 text-sm font-semibold">
            {{ table.title }}
          </div>

          <app-dynamic-matrix-table
            [topHeaders]="table.topHeaders || []"
            [columns]="table.columns || []"
            [rows]="table.rows || []"
            [showRowActions]="!!table.showRowActions"
            [minRows]="table.minRows || 1"
            (dataChange)="onTableDataChange(table.id, $event)"
          />
        </div>
      </div>

      <div formFooter class="flex items-center justify-end gap-3">
        <button
          type="button"
          class="pt-glass-table__control inline-flex h-9 min-w-[7rem] items-center justify-center gap-2 rounded-lg px-5 text-xs font-semibold uppercase tracking-wide transition active:scale-[0.98]"
          (click)="showCreateLayout = false"
        >
          <i class="fa fa-times text-[11px]" aria-hidden="true"></i>
          Cancel
        </button>
        <button
          type="button"
          class="pt-glass-btn-primary inline-flex h-9 min-w-[7rem] items-center justify-center gap-2 rounded-lg px-5 text-xs font-semibold uppercase tracking-wide shadow-lg transition active:scale-[0.98]"
          (click)="handleSubmit()"
        >
          <i class="fa fa-save text-[11px]" aria-hidden="true"></i>
          Save
        </button>
      </div>
    </app-form-card>
  </div>
</div>
