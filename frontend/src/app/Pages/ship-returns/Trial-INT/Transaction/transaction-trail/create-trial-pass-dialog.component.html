<app-add-form
  *ngIf="open"
  [width]="'75vw'"
  [open]="open"
  [formData]="editFormData"
  [fromTitle]="title"
  [formConfig]="formConfigForInitiateTrialPass"
  [submitLabel]="'Save'"
  (onSubmit)="handleTrialPassSubmit($event)"
  (onOpenChange)="onShellOpenChange($event)"
  (onFieldChange)="onEquipmentFieldChange($event)"
  [isReadonly]="readOnly">
</app-add-form>
