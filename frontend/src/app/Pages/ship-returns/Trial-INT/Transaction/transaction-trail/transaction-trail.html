<!-- Filter Section -->
<section class=" mt-3 mb-4 rounded-xl border border-white/15 bg-white/[0.06] p-2 shadow-lg">
  <div class="grid w-full grid-cols-1 items-end gap-4 md:grid-cols-[minmax(220px,1fr)_minmax(220px,1fr)_auto]">
    <div class="min-w-0">
      <app-select
        [label]="'Trial Unit Filter'"
        [placeholder]="'--Select--'"
        [options]="optionMap.trialUnit"
        [(ngModel)]="selectedTrialUnit"
        (valueChange)="onFilterChange()">
      </app-select>
    </div>

    <div class="min-w-0">
      <app-select
        [label]="'Status Filter'"
        [placeholder]="'--Select--'"
        [searchable]="false"
        [options]="statusOptions"
        [(ngModel)]="selectedStatus"
        (valueChange)="onStatusChange($event)">
      </app-select>
    </div>

    <div class="flex w-full items-end md:w-auto">
      <button
        type="button"
        (click)="clearFilters()"
        class="inline-flex h-[45px] w-full items-center justify-center rounded-[10px] border border-white/30 bg-white/10 px-5 text-sm font-semibold text-white transition hover:border-[#61C2FF] hover:bg-[#1069AB] active:translate-y-px md:w-auto">
        Clear Filters
      </button>
    </div>
  </div>
</section>

<!-- Paginate Table -->
<app-paginate-table
  #pagination
  [title]="'Trials'"
  [description]="'Manage trials'"
  [url]="currentTableUrl"
  [showHeaderSection]="true"
  [showSearch]="true"
  [columnDefs]="columnDefs"
  [showPagination]="true"
  [addButtons]="addButtons"
  (addButtonClick)="openInitiateForm()">
</app-paginate-table>

<!-- Initiate Trials Dialog -->
<app-initiate-trials-dialog
  #initiateTrials
  [open]="showCreateLayout"
  (openChange)="showCreateLayout = $event"
  [optionMap]="optionMap"
  [dropdownsLoaded]="dropdownsLoaded"
  [readOnly]="isViewMode"
  [title]="initiateTitle">
</app-initiate-trials-dialog>

<!-- Create Trial Pass Dialog -->
<app-create-trial-pass-dialog
  [open]="showTrialPassLayout"
  (openChange)="showTrialPassLayout = $event"
  [optionMap]="optionMap"
  [readOnly]="isViewMode">
</app-create-trial-pass-dialog>

<!-- Approval Workflow -->
<app-approval-work-flow
  *ngIf="showApprovalWorkflowPopup"
  [showUserPopuphead]="showApprovalWorkflowPopup"
  [workflowTrialId]="selectedWorkflowTrialId || ''"
  [autoOpenHistory]="autoOpenHistory"
  (showUserPopupChange)="showApprovalWorkflowPopup = $event">
</app-approval-work-flow>
