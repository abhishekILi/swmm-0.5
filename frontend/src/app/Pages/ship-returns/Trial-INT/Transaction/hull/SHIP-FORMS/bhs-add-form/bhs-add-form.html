<app-toast></app-toast>
<app-form-card
  title="BOAT HISTORY SHEET"
  headerColor="#0f172a"
  textColor="#ffffff"
  (action)="openApprovalWorkflow()"
>
  <!-- FORM CONTENT -->
  <form [formGroup]="form" class="p-0">
    <!-- ----------ALL THE BELOW FEILDS ARE FILLED UP AUTO MATICALLY WHEN USER SELECT REGIS. NUMBER --------------------------- -->
    <div class="grid grid-cols-3 gap-3 mt-3">
      <app-select
        label="Ship"
        formControlName="ship_id"
        [options]="shipOptions"
        placeholder="--Select--"
        class="w-full"
      >
      </app-select>

      <app-select
        label="Boat OEM & Registration Number"
        formControlName="bhs_reg_no"
        [options]="boatRegistrationOptions"
      >
      </app-select>

      <app-input label="Type of Boat" formControlName="bhs_type_of_boat">
      </app-input>

      <app-input
        label="Engine OEM (Make of Engine)"
        formControlName="bhs_engine_oem"
      >
      </app-input>

      <app-input label="Boat builder" formControlName="bhs_boat_builder">
      </app-input>

      <app-input label="Built year" formControlName="bhs_built_year">
      </app-input>

      <app-calendar
        label="Original Date of supply"
        formControlName="bhs_date_of_supply"
      ></app-calendar>

      <app-input label="Unit" formControlName="bhs_unit"> </app-input>

      <app-calendar
        label="Date of Re-Appropriation"
        formControlName="bhs_date_reappropriation"
      ></app-calendar>

      <app-input label="Serial No. PORT" formControlName="bhs_sn_port">
      </app-input>
      <app-input label="Serial No. STBD" formControlName="bhs_sn_stbd">
      </app-input>
      <app-input label="Serial No. Center" formControlName="bhs_sn_center">
      </app-input>

      <app-year-picker
        label="Year of rendering"
        [required]="true"
        [min]="2000"
        [max]="2026"
        formControlName="bhs_year_of_rendering"
      >
      </app-year-picker>

      <app-select
        label="BER/ ABER"
        formControlName="bhs_ber_aber"
        [options]="BerAberOptions"
      >
      </app-select>

      <app-radio-group
        label="Occasion of Rendering"
        formControlName="bhs_occ_of_rendering"
        [options]="[
          { label: 'Annually', value: 'annually' },
          { label: 'Initially', value: 'initially' },
        ]"
      >
      </app-radio-group>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <app-select
        label="Condition of hull"
        formControlName="bhs_cond_of_hull"
        [options]="satUnsatOptions"
      >
      </app-select>

      <app-select
        label="Condition of fittings"
        formControlName="bhs_cond_of_fittings"
        [options]="satUnsatOptions"
      >
      </app-select>

      <app-input
        label="Condition of Lifting arrangement fitted on Boat"
        formControlName="bhs_cond_of_davit_lifting"
      >
      </app-input>
      <app-input
        label="Status of Integrated Navigation Suit for Boat(if fitted)"
        formControlName="status_of_integrated_navigation"
      >
      </app-input>
    </div>
    <!-- ---------------------------------------- TABLE CONFIGURATION ------------------------ -->
    <div class="col-span-2 mt-2">
      <!-- ROW COUNT INPUT -->
      <div class="mb-4 flex items-center space-x-4">
        <label class="text-sm font-medium text-gray-700">
          Enter Total Number of Rows:
        </label>
        <input
          type="number"
          min="1"
          max="99"
          class="w-20 px-3 py-2 border rounded-md"
          [value]="tableRows"
          (input)="onTableDetailsRowChanges($event)"
        />
      </div>
      <div class="overflow-x-auto w-full">
        <app-reusable-input-table
          [data]="tableDetailsData"
          [columns]="tableColumns"
        >
          <ng-template #inputTpl let-row let-index="index" let-field="field">
            <input
              class="w-full px-3 py-2 border rounded-md"
              [value]="row[field]"
              (input)="
                handleOpsTableChange(index, field, $any($event.target).value)
              "
            />
          </ng-template>
          <ng-template #ActionTemplate let-row let-index="index">
            <div class="flex gap-2">
              <lucide-icon
                [img]="deleteIcon"
                class="w-6 h-6 text-red-600 cursor-pointer"
                (click)="
                  handleTableAction({ type: 'delete', row, index, table: 'ac' })
                "
              >
              </lucide-icon>
            </div>
          </ng-template>
        </app-reusable-input-table>
      </div>
    </div>

    <!-- ====================================================================== -->
    <div class="form-section-header mt-3">SPEED TRIALS</div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <app-input
        label="Max. Speed Achieved During Current Trials"
        formControlName="max_speed_during_current_trails"
      >
      </app-input
      ><app-input
        label="Max. RPM Achieved During Current Trials"
        formControlName="max_rpm_during_current_trails"
      >
      </app-input
      ><app-input
        label="Max. Speed Achieved During PDI speed trials"
        formControlName="max_speed_during_pdi_speed_trails"
      >
      </app-input
      ><app-input
        label="Max. RPM Achieved During PDI speed trials"
        formControlName="max_rpm_during_pdi_speed_trails"
      >
      </app-input
      ><app-input
        label="If observed speed is less than 90% of PDI speed trials,remedial action taken/initiated"
        formControlName="remedial_action_taken"
      >
      </app-input>
    </div>

    <div class="form-section-header mt-3">WEIGHING OF BOAT</div>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <app-input
        label="Weighing Undertaken on"
        formControlName="weighing_undertaken_on"
      >
      </app-input>

      <app-input label="At (Location)" formControlName="weighing_location">
      </app-input>

      <app-input label="Observed Weight" formControlName="observed_weight">
      </app-input>

      <app-input
        label="Weight Recorded during PDI Trials"
        formControlName="pdi_trial_weight"
      >
      </app-input>
      <div class="col-span-2">
        <app-input
          label="If observed weight is greater than 10% of PDI trials weight, Remedial action taken/initiated"
          formControlName="weight_remedial_action_taken"
        >
        </app-input>
      </div>

      <app-input
        label="Major Repairs undertaken Since Last Return on Hull"
        formControlName="major_repairs_since_last_return"
      >
      </app-input>

      <app-input
        label="Assessed Remaining life of Hull - Years"
        formControlName="remaining_hull_life_years"
      >
      </app-input>

      <div class="flex flex-col gap-1">
        <app-calendar
          label="Due Date for Change of Collar"
          formControlName="due_date_change_of_collar"
        >
        </app-calendar>
      </div>

      <div class="flex flex-col gap-1">
        <app-calendar
          label="Validity of IMO Certificate"
          formControlName="imo_certificate_validity"
        >
        </app-calendar>
      </div>
      <div class="col-span-2">
        <app-textarea
          formControlName="assessment_board_remarks"
          label="Remarks of Assessment Board (Unit)"
          placeholder="Enter description"
          [rows]="1"
        >
        </app-textarea>
      </div>
    </div>

    <!-- ---------------------------------------------------------------------------------- -->
    <div class="form-section-header mt-3">AUTHORITY SIGNATURES</div>
    <div class="grid grid-cols-4 gap-3 mt-2">
      <div class="file-upload-field gap-1">
        <label class="form-label"> Board Formation Authority </label>
        <app-file-upload
          (fileSelected)="onFileChange($event!, 'boardFormationAuthority')"
        >
        </app-file-upload>
      </div>
      <div class="file-upload-field gap-1">
        <label class="form-label"> Board Member 1 </label>
        <app-file-upload (fileSelected)="onFileChange($event!, 'boardMember1')">
        </app-file-upload>
      </div>
      <div class="file-upload-field gap-1">
        <label class="form-label"> Board Member 2 </label>
        <app-file-upload (fileSelected)="onFileChange($event!, 'boardMember2')">
        </app-file-upload>
      </div>
      <div class="file-upload-field gap-1">
        <label class="form-label"> Board President </label>
        <app-file-upload
          (fileSelected)="onFileChange($event!, 'boardPresident')"
        >
        </app-file-upload>
      </div>
    </div>
  </form>

  <!-- FOOTER -->
  <div
    formFooter
    class="flex gap-5"
    [ngClass]="viewMode ? 'justify-start' : 'justify-center'"
  >
    <app-reusable-button label="Back" variant="back" (clicked)="handleBack()">
    </app-reusable-button>
    <app-loading-button
      *ngIf="!viewMode"
      label="Clear"
      [color]="'red'"
      [icon]="restartIcon"
      (clicked)="clear()"
    ></app-loading-button>
    <app-loading-button
      *ngIf="!viewMode"
      label="Save draft"
      [color]="'blue'"
      [icon]="draftIcon"
      [loading]="draftLoading"
      (clicked)="handleSave('draft')"
    ></app-loading-button>

    <app-loading-button
      *ngIf="!viewMode"
      label="Submit for approval"
      [color]="'green'"
      [icon]="saveIcon"
      [loading]="saveLoading"
      (clicked)="handleSave('save')"
    ></app-loading-button>
  </div>
</app-form-card>
<app-approval-work-flow
  *ngIf="showApprovalWorkflowPopup"
  [showUserPopuphead]="showApprovalWorkflowPopup"
  [workflowTrialId]="rowId || form.get('id')?.value || ''"
  [rowData]="editDataDetails"
  [context]="editDataDetails"
  (showUserPopupChange)="onApprovalPopupChange($event)"
>
</app-approval-work-flow>

<app-reusable-delete-dialog-dynamic-content
  [open]="tableRowDeleteDialogOpen"
  title="Delete Row"
  (close)="closeDeleteDialog()"
  (confirm)="confirmDelete()"
>
  <p>Are you sure you want to delete this row?</p>
  <p class="text-sm text-red-500">This action cannot be undone.</p>
</app-reusable-delete-dialog-dynamic-content>
