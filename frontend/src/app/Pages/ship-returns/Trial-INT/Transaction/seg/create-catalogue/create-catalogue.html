<div class="pt-glass-table mx-auto w-full max-w-[1800px] p-2 sm:p-3">
  <app-paginate-table
    #catalogueTable
    [showHeaderSection]="true"
    [title]="'SEG Catalogue'"
    [description]="'Manage your SEG catalogues here'"
    [showSearch]="true"
    [showFilterButton]="false"
    [url]="tableUrl"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [showPagination]="true"
    [addButtons]="addButtons"
    (addButtonClick)="handleAddButtonClick($event)">
  </app-paginate-table>
</div>
