<app-toast></app-toast>
<app-form-card
  title="UNDERWATER HULL, TANKS AND COMPARTMENT"
  [showPreviousReport]="true"
  [showBackButton]="true"
  [showPaginator]="true"
  [previewMode]="true"
  [pageScroll]="true"
>
  <div
    previewHeader
    class="flex items-center gap-2 overflow-x-auto flex-nowrap scrollbar-hide max-w-[420px]"
  >
    <button
      *ngFor="let tab of headerEquipmentTabs; trackBy: trackByEquipment"
      type="button"
      (click)="setActiveTab(tab)"
      class="pt-glass-form-tab relative min-h-[46px] min-w-[130px] max-w-[160px] shrink-0 overflow-hidden rounded-[14px] px-2 text-center"
      [class.pt-glass-form-tab--active]="isSameEquipment(activeHeaderEquipment, tab)"
    >
      <span
        class="relative block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap pt-1 text-[11px] font-bold tracking-wide"
      >
        {{ tab?.equipment_name || tab?.name || tab?.nomenclature || 'Equipment'
        }}
      </span>

      <span
        class="relative mt-0.5 block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap text-[9px] font-semibold"
        [ngClass]="isSameEquipment(activeHeaderEquipment, tab) ? 'pt-glass-form-tab-sub--active' : 'pt-glass-form-tab-sub--idle'"
      >
        {{ tab?.nomenclature || tab?.equipment_nomenclature || '-' }} - {{
        tab?.serial_no || tab?.serial_number || '-' }}
      </span>
    </button>
  </div>
  <!-- FORM CONTENT -->
  <form [formGroup]="form" class="p-0">
    <!-- ROW 1 -->
    <div class="grid grid-cols-2 gap-3">
      <app-input
        [label]="'Ship/Submarine*'"
        formControlName="ship_or_submarine"
        class="w-full"
      >
      </app-input>
      <app-input
        [label]="'Ship*'"
        formControlName="ship"
        placeholder="ship name"
        class="w-full"
      >
      </app-input>
      <app-calendar
        [label]="'Date of conduct of trials*'"
        formControlName="date_of_conduct_trail"
      ></app-calendar>

      <app-select
        [label]="'Place of conduct of trials*'"
        formControlName="place_of_conduct_trail"
        [options]="placesOptions"
        placeholder="--Select--"
        class="w-full"
      >
      </app-select>
    </div>

    <!-- ---------------------------------- AUTHORITY OF CONDUCT TRAILS -------------------- -->
    <app-parameter-card serial="" title="Authority for conduct of Trials">
      <div class="grid grid-cols-3 gap-3 mt-3">
        <!-- Occasion for conduct of Trials -->
        <app-input
          label="Corespondence(fax/letter,etc)*"
          formControlName="authority"
        >
        </app-input>

        <app-calendar
          label="Date*"
          formControlName="authority_date"
          [max]="form.get('date_of_conduct_trail')?.value"
        >
        </app-calendar>

        <app-file-upload
          [label]="'Upload doc*'"
          formControlName="authority_doc"
        >
        </app-file-upload>
      </div>
    </app-parameter-card>

    <br />

    <!-- ===================== TABS ===================== -->
    <app-tabs
      [labels]="[
        'Internal Underwater Hull, Tanks and Compartment',
        'External Underwater Hull, Tanks and Compartment'
      ]"
    >
      <ng-template>
        <div class="col-span-2 mt-2">
          <div class="overflow-x-auto w-full">
            <app-reusable-input-table
              [data]="internalTableData"
              [columns]="internalColumns"
              [enableRowActions]="true"
              (actionClick)="handleInternalTableAction($event)"
              (valueChanged)="handleInternalTableChange($event.index, $event.field, $event.value)"
            >
            </app-reusable-input-table>
          </div>
        </div>
      </ng-template>
      <ng-template>
        <div class="col-span-2 mt-2">
          <div class="overflow-x-auto w-full">
            <app-reusable-input-table
              [data]="externalTableData"
              [columns]="externalColumns"
              [enableRowActions]="true"
              (actionClick)="handleExternalTableAction($event)"
              (valueChanged)="handleExternalTableChange($event.index, $event.field, $event.value)"
            >
            </app-reusable-input-table>
          </div>
        </div>
      </ng-template>
    </app-tabs>
  </form>

  <div formFooter class="flex gap-3 justify-end py-2">
    <app-loading-button
      *ngIf="formApiService?.context?.workflow_rights?.save_draft"
      color="draft"
      label="Save Draft"
      [loading]="draftLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('draft')"
    >
    </app-loading-button>

    <app-loading-button
      color="save"
      label="Save"
      [loading]="saveLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('save')"
    >
    </app-loading-button>

    <app-loading-button
      color="submit"
      label="Submit"
      [loading]="submitLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('submit')"
    >
    </app-loading-button>
  </div>
</app-form-card>

<!-- DELETE DIALOG FOR INTERNAL TABLE -->
<app-reusable-delete-dialog-dynamic-content
  [open]="internalDeleteDialogOpen"
  title="Delete Row"
  (close)="closeInternalDeleteDialog()"
  (confirm)="confirmInternalDelete()"
>
  <p>Are you sure you want to delete this row?</p>
  <p class="text-sm text-red-500">This action cannot be undone.</p>
</app-reusable-delete-dialog-dynamic-content>

<!-- DELETE DIALOG FOR EXTERNAL TABLE -->
<app-reusable-delete-dialog-dynamic-content
  [open]="externalDeleteDialogOpen"
  title="Delete Row"
  (close)="closeExternalDeleteDialog()"
  (confirm)="confirmExternalDelete()"
>
  <p>Are you sure you want to delete this row?</p>
  <p class="text-sm text-red-500">This action cannot be undone.</p>
</app-reusable-delete-dialog-dynamic-content>



<app-approval-work-flow
  *ngIf="showApprovalWorkflowPopup"
  [showUserPopuphead]="showApprovalWorkflowPopup"
  [workflowTrialId]="workflowTrialId || ''"
  [context]="formApiService.context"
  [isSubmitTime]="isSubmitTime"
  (showUserPopupChange)="showApprovalWorkflowPopup = $event; isSubmitTime = $event"
>
</app-approval-work-flow>
