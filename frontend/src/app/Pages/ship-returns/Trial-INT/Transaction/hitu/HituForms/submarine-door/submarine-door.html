<app-form-card
  title="DOORS/ HATCHES/ EMERGENCY[RKMHI1.1] ESCAPE HATCHES/ SCU
TTLES/ PORTHOLES – IN SUBMARINE"
  [showPreviousReport]="true"
  [showBackButton]="true"
  [showPaginator]="true"
  [previewMode]="true"
  [pageScroll]="true"
>
  <div
    previewHeader
    class="flex items-center gap-2 overflow-x-auto flex-nowrap scrollbar-hide max-w-[420px]"
  >
    <button
      *ngFor="let tab of headerEquipmentTabs; trackBy: trackByEquipment"
      type="button"
      (click)="setActiveTab(tab)"
      class="pt-glass-form-tab relative min-h-[46px] min-w-[130px] max-w-[160px] shrink-0 overflow-hidden rounded-[14px] px-2 text-center"
      [class.pt-glass-form-tab--active]="isSameEquipment(activeHeaderEquipment, tab)"
    >
      <span
        class="relative block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap pt-1 text-[11px] font-bold tracking-wide"
      >
        {{ tab?.equipment_name || tab?.name || tab?.nomenclature || 'Submarine'
        }}
      </span>

      <span
        class="relative mt-0.5 block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap text-[9px] font-semibold"
        [ngClass]="
          isSameEquipment(activeHeaderEquipment, tab)
            ? 'pt-glass-form-tab-sub--active'
            : 'pt-glass-form-tab-sub--idle'
        "
      >
        {{ tab?.nomenclature || tab?.equipment_nomenclature || '-' }} - {{
        tab?.serial_no || tab?.serial_number || '-' }}
      </span>
    </button>
  </div>
  <!-- FORM CONTENT -->
  <form [formGroup]="form" class="p-0 pb-12">
    <!-- ROW 1 -->
    <div class="grid grid-cols-3 gap-3">
      <div class="flex flex-col gap-1">
        <app-input label="Submarine*" formControlName="submarine_id">
        </app-input>
      </div>

      <!-- Date of conduct of trials  -->
      <app-calendar
        label="Date of conduct of trials*"
        formControlName="date_of_conduct_trail"
      ></app-calendar>
      <!--Place of conduct of trials  -->
      <div class="flex flex-col gap-1">
        <app-select
          [label]="'Place of conduct of trials*'"
          formControlName="place_of_conduct_trail"
          [searchable]="false"
          [options]="locationOptions"
          placeholder="--Select--"
          class="w-full"
        >
        </app-select>
      </div>
      <!-- Document No. -->
      <app-input label="Document No.*" formControlName="document_no">
      </app-input>

      <app-select
        [label]="'Occasion for conduct of Trials*'"
        formControlName="occasion_of_conduct_trail"
        [searchable]="false"
        [options]="occasionOptions"
        placeholder="--Select--"
        class="w-full"
      >
      </app-select>
    </div>

    <!-- ---------------------------------- AUTHORITY OF CONDUCT TRAILS -------------------- -->
    <app-parameter-card serial="" title="Authority for conduct of Trials">
      <div class="grid grid-cols-3 gap-3 mt-3">
        <!-- Occasion for conduct of Trials -->
        <app-input
          label="Corespondence(fax/letter,etc)*"
          formControlName="authority"
        >
        </app-input>

        <app-calendar
          label="Date*"
          formControlName="authority_date"
          [max]="form.get('date_of_conduct_trail')?.value"
        >
        </app-calendar>

        <app-file-upload
          [label]="'Upload doc*'"
          formControlName="authority_doc"
          (filesUploaded)="handleFilesUploaded($event)"
        >
        </app-file-upload>
      </div>
    </app-parameter-card>

    <div class="overflow-x-auto mt-5">
      <table class="min-w-full text-sm border">
        <!-- HEADER -->
        <thead>
          <tr class="hitu-table-header">
            <th class="hitu-table-rows-border">Ser</th>
            <th class="hitu-table-rows-border">Location</th>
            <th class="hitu-table-rows-border">Condition of Rubber Sealing</th>
            <th class="hitu-hitu-table-rows-border" colspan="2">
              Observations/Remarks
            </th>
          </tr>
        </thead>

        <tbody>
          <!-- 1 Fwd Escape Hatch -->
          <tr>
            <td class="hitu-table-rows-border text-center">1</td>
            <td class="hitu-table-rows-border space-5">
              <div>Fwd Escape Hatch</div>

              <app-select
                formControlName="fwd_lid_position"
                [searchable]="false"
                [options]="lidPositionOptions"
              >
              </app-select>
            </td>

            <!-- Condition of Rubber Sealing -->
            <td class="hitu-table-rows-border space-y-2">
              <app-select
                [searchable]="false"
                formControlName="fwd_status"
                [options]="statusOptions"
              >
              </app-select>
            </td>

            <!-- Observation / Remarks -->
            <td class="hitu-table-rows-border space-y-2" colspan="2">
              <!-- If SAT selected -->
              <div *ngIf="form.get('fwd_status')?.value === 'SAT'">
                <input
                  type="text"
                  class="custom-input w-full"
                  value="SAT"
                  readonly
                />
              </div>

              <!-- If UNSAT selected -->
              <div *ngIf="showFwdInput">
                <app-input
                  formControlName="fwd_obs"
                  placeholder="Enter Observation"
                >
                </app-input>
              </div>
            </td>
          </tr>

          <!-- 2 Conning Tower -->
          <tr>
            <td class="hitu-table-rows-border text-center">2</td>
            <td class="hitu-table-rows-border">
              <div>Conning Tower</div>

              <app-select
                formControlName="conning_lid_position"
                [searchable]="false"
                [options]="lidPositionOptions"
              >
              </app-select>
            </td>

            <td class="hitu-table-rows-border">
              <app-select
                formControlName="conning_status"
                [searchable]="false"
                [options]="statusOptions"
              >
              </app-select>
            </td>

            <td class="hitu-table-rows-border space-y-2" colspan="2">
              <!-- If SAT selected -->
              <div *ngIf="form.get('conning_status')?.value === 'SAT'">
                <input
                  type="text"
                  class="custom-input w-full"
                  value="SAT"
                  readonly
                />
              </div>

              <!-- If UNSAT selected -->
              <div *ngIf="showConningInput">
                <app-input
                  formControlName="conning_obs"
                  placeholder="Enter Observation"
                >
                </app-input>
              </div>
            </td>
          </tr>

          <!-- 3 Aft Escape Hatch -->
          <tr>
            <td class="hitu-table-rows-border text-center">3</td>
            <td class="hitu-table-rows-border">
              <div>Aft Escape Hatch</div>

              <app-select
                formControlName="aft_lid_position"
                [searchable]="false"
                [options]="lidPositionOptions"
              >
              </app-select>
            </td>

            <td class="hitu-table-rows-border">
              <app-select
                formControlName="aft_status"
                [searchable]="false"
                [options]="statusOptions"
              >
              </app-select>
            </td>

            <!-- Observation / Remarks (was stray outside the row before — now correctly inside a <td>) -->
            <td class="hitu-table-rows-border space-y-2" colspan="2">
              <!-- If SAT selected -->
              <div *ngIf="form.get('aft_status')?.value === 'SAT'">
                <input
                  type="text"
                  class="custom-input w-full"
                  value="SAT"
                  readonly
                />
              </div>

              <!-- If UNSAT selected -->
              <div *ngIf="showAftInput">
                <app-input
                  formControlName="aft_obs"
                  placeholder="Enter Observation"
                >
                </app-input>
              </div>
            </td>
          </tr>

          <!-- 4 Compartment Masters -->
          <tr>
            <td class="hitu-table-rows-border text-center">4</td>
            <td class="hitu-table-rows-border">
              <!-- Compartment Masters
              <app-dynamic-textarea [form]="form" controlName="compartment_master" placeholder="Enter details">
              </app-dynamic-textarea> -->
              <app-multiselect
                formControlName="deck_plating_obs_12"
                [options]="compartmentOptions"
                placeholder="--Select--"
                [searchable]="false"
                [label]="'Compartment'"
              >
              </app-multiselect>
            </td>
            <td class="hitu-table-rows-border space-y-2">
              <app-select
                formControlName="compartment"
                [options]="statusOptions"
                [searchable]="false"
              >
              </app-select>
            </td>

            <td class="hitu-table-rows-border space-y-2" colspan="2">
              <input
                formControlName="compartment_remarks"
                type="text"
                class="custom-input w-full"
                [readonly]="form.get('compartment')?.value === 'SAT'"
              />
            </td>
          </tr>

          <!-- 5 Other Observations -->
          <tr>
            <td class="hitu-table-rows-border text-center">5</td>
            <td class="hitu-table-rows-border">Any Other Observations</td>

            <td colspan="2" class="hitu-table-rows-border">
              <app-input
                formControlName="other_obs"
                class="input-field"
                rows="2"
                placeholder="Enter details"
              ></app-input>
            </td>
          </tr>

          <!-- 6 Overall -->
          <tr>
            <td class="hitu-table-rows-border text-center">6</td>
            <td class="hitu-table-rows-border font-semibold">
              Overall Remarks
            </td>

            <td colspan="3" class="hitu-table-rows-border">
              <app-select
                [searchable]="false"
                formControlName="overall_sel_remark"
                [options]="overallRemarksOptions"
                placeholder="--Select--"
              >
              </app-select>

              <!-- <div class="mt-2" *ngIf="showOverallInput">
                <textarea formControlName="overall_remark" class="input-field" rows="2"
                  placeholder="Enter remarks"></textarea>
              </div> -->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </form>

  <div formFooter class="flex gap-3 justify-end py-2">
    <app-loading-button
      *ngIf="formApiService?.context?.workflow_rights?.save_draft"
      color="draft"
      label="Save Draft"
      [loading]="draftLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('draft')"
    >
    </app-loading-button>

    <app-loading-button
      color="save"
      label="Save"
      [loading]="saveLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('save')"
    >
    </app-loading-button>

    <app-loading-button
      color="submit"
      label="Submit"
      [loading]="submitLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('submit')"
    >
    </app-loading-button>
  </div>
</app-form-card>

<app-approval-work-flow
  *ngIf="showApprovalWorkflowPopup"
  [showUserPopuphead]="showApprovalWorkflowPopup"
  [workflowTrialId]="workflowTrialId || ''"
  [context]="formApiService.context"
  [isSubmitTime]="isSubmitTime"
  (showUserPopupChange)="showApprovalWorkflowPopup = $event; isSubmitTime = $event"
>
</app-approval-work-flow>
