<app-toast></app-toast>
<app-form-card title="HVAC PHASE II - SHIP/SUBMARINE"
    smallTitle="VENTILATION TRIALS PHASE II FUNCTIONAL CHECKS (AT SEA)" [showPreviousReport]="true"
    [showBackButton]="true" [showPaginator]="true" [previewMode]="true" [pageScroll]="true">
     <div
        previewHeader
        class="flex items-center gap-2 overflow-x-auto flex-nowrap max-w-[420px]"
    >
        <button
            *ngFor="let tab of headerEquipmentTabs; trackBy: trackByEquipment"
            type="button"
            (click)="setActiveTab(tab)"
            class="border border-white/15 bg-white/5 text-white/75 transition hover:border-white/30 relative min-h-[46px] min-w-[130px] max-w-[160px] shrink-0 overflow-hidden rounded-[14px] px-2 text-center"
            [class.border-[#61C2FF]]="isSameEquipment(activeHeaderEquipment, tab)" [class.bg-[#1069AB]]="isSameEquipment(activeHeaderEquipment, tab)" [class.text-white]="isSameEquipment(activeHeaderEquipment, tab)"
        >
            <span class="relative block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap pt-1 text-[11px] font-bold tracking-wide">
                {{ tab?.equipment_name || tab?.name || tab?.nomenclature || 'Equipment' }}
            </span>
            <span
                class="relative mt-0.5 block max-w-[115px] overflow-hidden text-ellipsis whitespace-nowrap text-[9px] font-semibold"
                [ngClass]="isSameEquipment(activeHeaderEquipment, tab) ? 'text-white' : 'text-white/50'"
            >
                {{ tab?.nomenclature || tab?.equipment_nomenclature || '-' }} - {{ tab?.serial_no || tab?.serial_number || '-' }}
            </span>
        </button>
    </div>
    <!-- FORM CONTENT -->
    <form [formGroup]="form" class="p-0">
        <!-- ROW 1 -->
        <div class="grid grid-cols-3 gap-3">
            <div class="flex flex-col gap-1">
                <app-input [label]="'Vessel type*'" formControlName="vesselType" >
                </app-input>
            </div>
            <!-- SHIP STATUS -->
            <!-- <div class="flex flex-col gap-1">
                <app-select [label]="'Vessel type*'" formControlName="ship_or_submarine" [searchable]="false"
                    [options]="shipOptions" placeholder="--Select--" class="w-full">
                </app-select>
            </div> -->

            <!-- <app-input label="ship" formControlName="Ship">
            </app-input> -->

            <!-- Date of conduct of trials  -->
            <app-calendar label="Date of conduct of trials*" formControlName="date_of_conduct_trail"></app-calendar>
            <!--Place of conduct of trials  -->
            <div class="flex flex-col gap-1">
                <app-select [label]="'Place of conduct of trials*'" formControlName="place_of_conduct_trail"
                    [searchable]="false" [options]="locationOptions" placeholder="--Select--" class="w-full">
                </app-select>
            </div>
            <!-- Document No. -->
            <app-input label="Document No.*" formControlName="document_no">
            </app-input>
            <!-- Occasion for conduct of Trials -->
            <div class="flex flex-col gap-1">
                <app-select [label]="'Occasion for conduct of Trials*'" formControlName="occasion_of_conduct_trail"
                    [searchable]="false" [options]="occasionOptions" placeholder="--Select--" class="w-full">
                </app-select>
            </div>

        </div>

        <!-- ---------------------------------- AUTHORITY OF CONDUCT TRAILS -------------------- -->
        <app-parameter-card serial="" title="Authority for conduct of Trials">
            <div class="grid grid-cols-3 gap-3 mt-3">
                <!-- Occasion for conduct of Trials -->
                <app-input label="Corespondence(fax/letter,etc)*" formControlName="authority">
                </app-input>
                <app-calendar label="Date*" formControlName="authority_date"
                    [max]="form.get('date_of_conduct_trail')?.value">
                </app-calendar>
                <div class="file-upload-field gap-1">

                    <app-file-upload [label]="'Upload doc*'" formControlName="authority_doc"
                        (filesUploaded)="handleFilesUploaded($event)">
                    </app-file-upload>
                </div>

            </div>
        </app-parameter-card>
        <br />

        <app-tabs [labels]="[
        'TABLE 1 - AMBIENT CONDITIONS',
        'TABLE 2 - AC PLANT DATA',
        'TABLE 3 - CHILLED WATER MEASUREMENTS',
        'TABLE 4 - RECORD OF VALUES IN COMP',
        'TABLE 5 - RECORD OF VALUES IN MACHINERY/ GENERAL COMPARTMENTS' 

    ]">
            <!-- ------------------------------------- ALL TABLES -------------------------------------->

            <!--------------------------------------------------- TABLE 1 ----------------------------------------------------->
            <!------------------------------------ VENTILATION TRIALS PHASE II FUNCTIONAL CHECKS (AT SEA) ---------------------------------- -->
            <ng-template>
                <div class="overflow-x-auto border border-white/15 rounded-lg p-3">
                    Ambient Conditions
                </div>
                <div class="col-span-2 mt-2">
                    <div class="overflow-x-auto" [class.overflow-y-auto]="totalRowsAmbient > 5"
                        [class.max-h-96]="totalRowsAmbient > 5">
                        <app-form-input-table-with-headers [data]="ambientConditionsTableData"
                            [columns]="ambientConditionsColumns" [headerRows]="ambientConditionsHeaderRows"
                            [enableRowActions]="true"
                            (valueChanged)="handleAmbientConditionsTableChange($event.index, $event.field, $event.value)">
                            <ng-template #inputTpl let-row let-index="index" let-field="field">
                                <input class="w-full px-3 py-2 border rounded-md" [value]="row[field]"
                                    (input)="handleAmbientConditionsTableChange(index, field, $any($event.target).value)" />
                            </ng-template></app-form-input-table-with-headers>
                    </div>
                </div>
            </ng-template>
            <ng-template>
                <!--------------------------------------------------- TABLE 2 ----------------------------------------------------->
                <!-- AC Plant Data (SS-E to assist HITUs in record of these parameters. D-Design, A-Actual) -->
                <div class="overflow-x-auto border border-white/15 rounded-lg p-3">
                    AC Plant Data (SS-E to assist HITUs in record of these parameters. D-Design, A-Actual)
                </div>
                <div class="col-span-2 mt-2">
                    <div class="overflow-x-auto" [class.overflow-y-auto]="totalRowsAcPlant > 5"
                        [class.max-h-96]="totalRowsAcPlant > 5">
                        <app-form-input-table-with-headers [data]="acPlantTableData" [columns]="acPlantDataColumns"
                            [headerRows]="acPlantDataHeaderRows" [enableRowActions]="true">
                            <ng-template #inputTpl let-row let-index="index" let-field="field">
                                <input class="w-full px-3 py-2 border rounded-md" [value]="row[field]"
                                    (input)="handleAcPlantDataTableChange(index, field, $any($event.target).value)" />
                            </ng-template></app-form-input-table-with-headers>
                    </div>
                </div>
            </ng-template>
            <!--------------------------------------------------- TABLE 3 ----------------------------------------------------->
            <!----------------------------------------------- Chilled Water Measurements at ATU/ HEs ----------------------------------------------->
            <ng-template>
                <div class="overflow-x-auto border border-white/15 rounded-lg p-3">
                    Chilled Water Measurements at ATU/ HEs
                </div>

                <div class="col-span-2 mt-5">
                    <div class="overflow-x-auto" [class.overflow-y-auto]="totalRowsChilledWater > 5"
                        [class.max-h-96]="totalRowsChilledWater > 5">
                        <app-form-input-table-with-headers [data]="childWaterMgmtTableData"
                            [columns]="childWaterMgmtColumns" [headerRows]="childWaterMgmtheaderRows"
                            [enableRowActions]="true">
                            <ng-template #inputTpl let-row let-index="index" let-field="field">
                                <input class="w-full px-3 py-2 border rounded-md" [value]="row[field]"
                                    (input)="handlechildWaterMgmtTableChange(index, field, $any($event.target).value)" />
                            </ng-template></app-form-input-table-with-headers>
                    </div>
                </div>
            </ng-template>
            <!--------------------------------------------------- TABLE 4 ----------------------------------------------------->
            <!--------------------------------------- Record of Values inCompartments --------------------------------------->
            <ng-template>
                <div class="overflow-x-auto border border-white/15 rounded-lg p-3">
                    Record of Values in Compartments Served by ATUs/HEs
                </div>
                <div class="col-span-2 mt-5">


                    <div class="overflow-x-auto" [class.overflow-y-auto]="totalRowsRecordValueInMachinery > 5"
                        [class.max-h-96]="totalRowsRecordValueInMachinery > 5">
                        <app-form-input-table-with-headers [data]="recordOfValuesInCompartmentTableData"
                            [columns]="recordOfValuesInCompartmentColumns"
                            [headerRows]="recordOfValuesInCompartmentheaderRows" [enableRowActions]="true">
                            <ng-template #inputTpl let-row let-index="index" let-field="field">
                                <input class="w-full px-3 py-2 border rounded-md" [value]="row[field]"
                                    (input)="handlerecordOfValuesInCompartmentTableChange(index, field, $any($event.target).value)" />
                            </ng-template></app-form-input-table-with-headers>
                    </div>
                </div>
            </ng-template>
            <!--------------------------------------------------- TABLE 5 ----------------------------------------------------->

            <!--------------------------------------- Record of Values in Machinery/ General Compartments --------------------------------------->
            <ng-template>
                <div class="form-section-header-wo-top-margin">
                    Record of Values in Machinery/ General Compartments
                </div>
                <div class="col-span-2 mt-5">
                    <div class="overflow-x-auto" [class.overflow-y-auto]="totalRowsRecordValueInMachinery > 5"
                        [class.max-h-96]="totalRowsRecordValueInMachinery > 5">
                        <app-form-input-table-with-headers [data]="recordOfValuesInMachineryTableData"
                            [columns]="recordOfValuesInMachineryColumns"
                            [headerRows]="recordOfValuesInMachineryheaderRows" [enableRowActions]="true">
                            <ng-template #inputTpl let-row let-index="index" let-field="field">
                                <input class="w-full px-3 py-2 border rounded-md" [value]="row[field]"
                                    (input)="handlerecordOfValuesInMachineryTableChange(index, field, $any($event.target).value)" />
                            </ng-template></app-form-input-table-with-headers>
                    </div>
                </div>
            </ng-template>
        </app-tabs>
    </form>

    <!-- <button type="button" (click)="handleSave('draft')">
        Submit
    </button> -->

   <div formFooter class="flex gap-3 justify-end py-2">
    <app-loading-button
      *ngIf="formApiService?.context?.workflow_rights?.save_draft"
      color="draft"
      label="Save Draft"
      [loading]="draftLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('draft')"
    >
    </app-loading-button>

    <app-loading-button
      color="save"
      label="Save"
      [loading]="saveLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('save')"
    >
    </app-loading-button>

    <app-loading-button
      color="submit"
      label="Submit"
      [loading]="submitLoading"
      [disabled]="!formApiService?.context?.workflow_rights?.can_edit"
      (clicked)="handleSave('submit')"
    >
    </app-loading-button>
  </div>

</app-form-card>

<app-approval-work-flow
  *ngIf="showApprovalWorkflowPopup"
  [showUserPopuphead]="showApprovalWorkflowPopup"
  [workflowTrialId]="workflowTrialId || ''"
  [context]="formApiService.context"
  [isSubmitTime]="isSubmitTime"
  (showUserPopupChange)="showApprovalWorkflowPopup = $event; isSubmitTime = $event">
</app-approval-work-flow>
