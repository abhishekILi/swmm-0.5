<form [formGroup]="form" (ngSubmit)="search()">

  <div class="history-filter-grid glass-card">

    <app-select-input
      label="Period"
      [options]="maintenancePeriodOptions()"
      formControlName="maintenancePeriod">
    </app-select-input>

    <app-select-input
      label="Occasion"
      [options]="dartOccasionOptions()"
      formControlName="dartOccasion">
    </app-select-input>

    <app-select-input
      label="Sub-Dept"
      [options]="subDepartmentOptions()"
      formControlName="subDepartment">
    </app-select-input>

    <app-select-input
      label="Type"
      [options]="dartTypeOptions()"
      formControlName="dartType">
    </app-select-input>

    <div class="date-range-field">
      <span class="date-range-label">Defect Date Range</span>
      <div class="date-range-inputs">
        <app-icon name="calendar" [size]="16" variant="muted" />
        <input type="date" formControlName="dateFrom" class="date-range-input" />
        <span class="date-range-sep">to</span>
        <input type="date" formControlName="dateTo" class="date-range-input" />
      </div>
    </div>

    <app-select-input
      label="Department Name"
      [options]="departmentOptions()"
      formControlName="department">
    </app-select-input>

    <div class="equipment-search-field">
      <label for="equipment-search" class="date-range-label">Equipment (Name/Nom)</label>
      <div class="equipment-search-inputs">
        <input
          id="equipment-search"
          type="text"
          formControlName="equipment"
          placeholder="Search..."
          class="equipment-search-input"
        />
        <button type="submit" class="equipment-search-btn">
          <app-icon name="search" [size]="16" />
        </button>
      </div>
    </div>

  </div>

</form>

<div class="history-result-card">

  <!-- Toolbar -->
  <div class="flex items-center justify-end mb-4">
    <button
      type="button"
      (click)="syncWithCMMS()"
      class="flex items-center gap-1.5 px-3 h-10 rounded-lg bg-[#F4B400] text-[#171A1F] text-sm font-medium whitespace-nowrap"
    >
      <app-icon name="refresh-cw" [size]="14" />
      <span>Sync With CMMS</span>
    </button>
  </div>

  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2 text-white/60 text-sm">
      <select [(ngModel)]="pageSize" [ngModelOptions]="{standalone: true}" class="h-9 rounded-lg bg-white/5 border border-white/10 px-2 text-white text-sm">
        <option [value]="10">10</option>
        <option [value]="25">25</option>
        <option [value]="50">50</option>
      </select>
      entries
    </div>

    <div class="flex items-center gap-4">
      <button type="button" (click)="print()" title="Print">
        <app-icon name="printer" [size]="18" variant="accent" />
      </button>
      <button type="button" (click)="exportPlaceholder('PDF')" title="Export PDF">
        <app-icon name="file-text" [size]="18" variant="danger" />
      </button>
      <button type="button" (click)="exportPlaceholder('Excel')" title="Export Excel">
        <app-icon name="sheet" [size]="18" variant="success" />
      </button>
      <button type="button" (click)="exportPlaceholder('Copy')" title="Copy">
        <app-icon name="copy" [size]="18" variant="inherit" />
      </button>

      <div class="flex items-center gap-2">
        <span class="text-white/60 text-sm">Search:</span>
        <input
          type="text"
          [(ngModel)]="tableSearch"
          [ngModelOptions]="{standalone: true}"
          class="h-9 rounded-lg bg-white/5 border border-white/10 px-3 text-white text-sm w-48"
        />
      </div>
    </div>
  </div>

  @if(errorMessage) {

    <div class="error-message">
      {{ errorMessage }}
    </div>

  } @else {

   <app-data-grid
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [pageSize]="pageSize"
      height="440px"
        >
    </app-data-grid>

  }

</div>
