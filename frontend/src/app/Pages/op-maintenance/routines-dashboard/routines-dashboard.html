<app-master-card cardTitle="Unique Maintop Routines">
  <div class="pb-2">
    <form [formGroup]="unique_main_top">
      <div class="flex items-end gap-3 mt-4">
        <div class="flex-1 min-w-0">
          <app-select-input
            label="Sub-department"
            [options]="subDepartmentOptions"
            formControlName="subDepartment"
          >
          </app-select-input>
        </div>

        <div class="flex-1 min-w-0">
          <app-select-input
            label="Equipment Name"
            [options]="equipmentNameOptions"
            formControlName="equipmentName"
          >
          </app-select-input>
        </div>

        <div class="flex-1 min-w-0">
          <app-select-input
            label="Routine Category"
            [options]="routineCategoryOptions"
            formControlName="routineCategory"
          >
          </app-select-input>
        </div>

        <div class="flex-1 min-w-0">
          <app-select-input
            label="Routine Name (>3 Month)"
            [options]="routineNameOptions"
            formControlName="routineName"
          >
          </app-select-input>
        </div>

        <button
          type="button"
          (click)="clearFilters()"
          class="h-11 px-4 rounded-[10px] bg-white/10 border border-white/10 text-white whitespace-nowrap shrink-0"
        >
          Clear Filter
        </button>
      </div>
    </form>
  </div>
  <div class="flex items-center mt-4 mb-4">
    <div class="relative w-[83%] shrink-0">
      <!-- Search Icon -->
      <div
        class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none z-10"
      >
        <app-icon name="search" [size]="16" [strokeWidth]="2" color="currentColor" />
      </div>

      <!-- Input -->
      <input
        type="text"
        (input)="onSearch($event)"
        placeholder="Search"
        class="w-full h-10 rounded-[10px] bg-white/[0.04] border border-white/10 pl-10 pr-3 content text-white placeholder:text-white/40 outline-none focus:border-white/20"
      />
    </div>

    <div class="flex gap-2 pl-2">
      <button
        class="flex items-center px-4 h-10 rounded-lg bg-white/10 border border-white/10 text-white"
      >
        <span class="mr-3">Export</span>

        <div class="flex items-center gap-3">
          <app-icon name="file-text" [size]="16" />

          <app-icon name="sheet" [size]="16" />

          <app-icon name="printer" [size]="16" />
        </div>
      </button>
    </div>
  </div>

  <div class="fuss-grid-wrapper w-full mt-4">
    <app-data-grid
      [columnDefs]="defectColumnDefs"
      [rowData]="filteredMaintopRoutines()"
      [pageSize]="10"
      height="440px"
    >
    </app-data-grid>
  </div>
</app-master-card>
