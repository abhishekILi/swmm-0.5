<app-master-card cardTitle="Equipment Due For ABER">
  <div class="pb-2">
    <form [formGroup]="equipment_due_for_aber_form">
      <div class="flex items-end gap-3 mt-4">
        <div class="flex-1 min-w-0">
          <app-select-input
            label="Equipment Nomenclature"
            [options]="nomenclatureOptions"
            formControlName="nomenclature"
          >
          </app-select-input>
        </div>

        <div class="flex-1 min-w-0">
          <app-select-input
            label="Compartment Name"
            [options]="compartmentOptions"
            formControlName="compartment"
          >
          </app-select-input>
        </div>

        <button
          type="button"
          (click)="clearFilters()"
          class="h-11 px-4 rounded-[10px] bg-white/10 border border-white/10 text-white whitespace-nowrap shrink-0"
        >
          Clear Filter
        </button>
      </div>
    </form>
  </div>

  <!-- Legend -->
  <div class="flex items-center gap-10 mt-4 mb-5">
    <div class="flex items-center gap-2">
      <app-icon name="flag" [size]="16" class="text-[#FF4D4F]" />

      <span class="text-[13px] font-normal text-white/90 font-['Inter']">
        Due for ABER (&gt;= 7 years)
      </span>
    </div>

    <div class="flex items-center gap-2">
      <app-icon name="flag" [size]="16" class="text-[#FFB020]" />

      <span class="text-[13px] font-normal text-white/90 font-['Inter']">
        No Due for ABER
      </span>
    </div>
  </div>

  <!-- Search & Export -->
  <div class="flex justify-evenly items-center mt-4 mb-4">
    <div class="relative w-[83%] shrink-0">
      <div
        class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 pointer-events-none z-10"
      >
        <app-icon name="search" [size]="16" [strokeWidth]="2" color="currentColor" />
      </div>

      <input
        type="text"
        (input)="onSearch($event)"
        placeholder="Search"
        class="w-full h-10 rounded-[10px] bg-white/[0.04] border border-white/10 pl-10 pr-3 text-white placeholder:text-white/40 outline-none focus:border-white/20"
      />
    </div>

    <div class="flex gap-2 pl-2">
      <button
        type="button"
        class="flex items-center px-4 h-10 rounded-lg bg-white/10 border border-white/10 text-white"
      >
        <span class="mr-3">Export</span>

        <div class="flex items-center gap-3">
          <app-icon name="file-text" [size]="16" />

          <app-icon name="sheet" [size]="16" />

          <app-icon name="printer" [size]="16" />
        </div>
      </button>
    </div>
  </div>

  <!-- Grid -->
  <div class="fuss-grid-wrapper w-full mt-4">
    <app-data-grid
      [columnDefs]="defectColumnDefs"
      [rowData]="filteredMaintopRoutines()"
      [pageSize]="10"
      height="440px"
    >
    </app-data-grid>
  </div>
</app-master-card>
