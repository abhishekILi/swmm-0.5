<app-master-card cardTitle="Closed DART" cardHeight="auto">
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="text-white/50 border-b border-white/10">
        <tr>
          <th class="py-2 pr-3">DART Number</th>
          <th class="py-2 pr-3">Sr No</th>
          <th class="py-2 pr-3">Date</th>
          <th class="py-2 pr-3">Equipment Name</th>
          <th class="py-2 pr-3">Department</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.dart_number) {
          <tr class="border-b border-white/5">
            <td class="py-2 pr-3">{{ row.dart_number }}</td>
            <td class="py-2 pr-3">{{ row.sr_no }}</td>
            <td class="py-2 pr-3">{{ row.date }}</td>
            <td class="py-2 pr-3">{{ row.equipment_name }}</td>
            <td class="py-2 pr-3">{{ row.department }}</td>
          </tr>
        }
        @if (!rows.length) {
          <tr>
            <td colspan="5" class="py-6 text-center text-white/40">No closed DARTs found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</app-master-card>
