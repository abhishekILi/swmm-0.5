<app-obs-help-guidance />

<div class="glass-card wed-panel">
  <div class="wed-panel__header">
    <h3>Masters</h3>
  </div>

  <div class="wed-tabs-row">
    <button type="button" class="wed-tab-btn" [class.wed-tab-btn--active]="activeTab() === 'mapping'" (click)="selectTab('mapping')">
      Ship Inventory to WED Inventory Mapping
    </button>
    <button type="button" class="wed-tab-btn" [class.wed-tab-btn--active]="activeTab() === 'get-data'" (click)="selectTab('get-data')">
      Get Data
    </button>
  </div>

  @if (activeTab() === "mapping") {
    <form [formGroup]="mapForm" class="wed-form-grid">
      <app-select-input label="INSMA Equipment Name" formControlName="equipmentName" [options]="[]" />
      <app-select-input label="WED Equipment Name" formControlName="equipmentClass" [options]="[]" />
      <div class="wed-form-grid__actions">
        <button type="button" class="btn-primary" (click)="submitMap()">Submit</button>
      </div>
    </form>

    <h4 class="wed-subheading">Mapped List</h4>
    <app-data-grid [rowData]="mappedRows()" [columnDefs]="columnDefs" height="320px" />
  }

  @if (activeTab() === "get-data") {
    <div class="wed-get-data__actions">
      <button type="button" class="btn-primary" [disabled]="syncingEquipment()" (click)="syncEquipment()">
        {{ syncingEquipment() ? "Syncing..." : "Equipment Get Data from WED" }}
      </button>
      <button type="button" class="btn-primary" [disabled]="syncingSpares()" (click)="syncSpares()">
        {{ syncingSpares() ? "Syncing..." : "Spare Get Data from WED" }}
      </button>
    </div>
  }
</div>
