<app-obs-help-guidance [bodyHtml]="helpHtml" />

<div class="glass-card obs-panel">
  <div class="obs-panel__header">
    <h3>{{ title }}</h3>
    <div class="obs-panel__actions">
      <button type="button" class="btn-secondary" [disabled]="!canIssue" (click)="initiateIssue()">
        Initiate Issue - Multiple Spares
      </button>
      @if (kind === "defect") {
        <button type="button" class="btn-secondary" [disabled]="!selectedRows().length" (click)="raiseDart()">
          Raise DART - Multiple
        </button>
      }
      <button type="button" class="btn-primary" [disabled]="!selectedRows().length" (click)="openCartModal('WLMS')">
        Send to WED Cart - Multiple
      </button>
      <button type="button" class="btn-primary" [disabled]="!selectedRows().length" (click)="openCartModal('ILMS')">
        Send to MO Cart - Multiple
      </button>
    </div>
  </div>

  <div class="grid-toolbar">
    <app-toolbar-search [value]="searchText()" (valueChange)="searchText.set($event)" />
    <div class="grid-toolbar__end">
      <button type="button" class="icon-btn" title="Copy to clipboard" (click)="copyRows()">
        <app-icon name="clipboard" [size]="16" variant="inherit" />
      </button>
      <app-export-toolbar [busy]="exportBusy()" (exportRequested)="onExport($event)" />
    </div>
  </div>

  <app-data-grid
    [rowData]="filteredEntries()"
    [columnDefs]="columnDefs"
    [showCheckboxes]="true"
    height="440px"
    (selectionChanged)="onSelectionChanged($event)"
  />
</div>

@if (cartModalOpen()) {
  <app-modal size="sm" (closeModal)="closeCartModal()">
    <h3 class="obs-modal__title">Send to {{ cartTarget() === "WLMS" ? "WED" : "MO" }} Cart</h3>

    <form [formGroup]="cartForm" class="obs-modal__form">
      <app-select-input label="Cart Type" formControlName="cartType" [options]="cartTypeOptions" />
    </form>

    <div class="obs-modal__actions">
      <button type="button" class="btn-secondary" (click)="closeCartModal()">Cancel</button>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="confirmSendToCart()">
        {{ saving() ? "Sending..." : "Confirm" }}
      </button>
    </div>
  </app-modal>
}
