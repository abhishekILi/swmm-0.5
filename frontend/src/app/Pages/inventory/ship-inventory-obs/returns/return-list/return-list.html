<app-obs-help-guidance [bodyHtml]="helpHtml" />

<div class="glass-card obs-panel">
  <div class="obs-panel__header">
    <h3>Results : Return Spares</h3>
  </div>

  <div class="grid-toolbar">
    <app-toolbar-search [value]="searchText()" (valueChange)="searchText.set($event)" />
    <div class="grid-toolbar__end">
      <button type="button" class="icon-btn" title="Copy to clipboard" (click)="copyRows()">
        <app-icon name="clipboard" [size]="16" variant="inherit" />
      </button>
      <app-export-toolbar [busy]="exportBusy()" (exportRequested)="onExport($event)" />
    </div>
  </div>

  <div class="obs-filter-row">
    <label class="obs-checkbox">
      <input type="checkbox" [checked]="criticalOnly()" (change)="criticalOnly.set(!criticalOnly())" />
      Critical
    </label>
    <div class="obs-filter-row__categories">
      <span class="obs-filter-row__label">Category</span>
      @for (option of categoryFilterOptions; track option.key) {
        <label class="obs-checkbox">
          <input type="checkbox" [checked]="categoryFilters()[option.key]" (change)="toggleCategory(option.key)" />
          {{ option.label }}
        </label>
      }
    </div>
  </div>

  <app-data-grid
    [rowData]="filteredEntries()"
    [columnDefs]="columnDefs"
    height="480px"
    (rowClicked)="onRowClicked($event)"
  />
</div>

@if (activeEntry(); as entry) {
  <app-modal size="sm" (closeModal)="closeModal()">
    <h3 class="obs-modal__title">Return Details</h3>
    <p class="obs-modal__subtitle">{{ entry.patternNumber }} — {{ entry.description }}</p>

    <form [formGroup]="form" class="obs-modal__form">
      <app-input-field label="Qty Returned *" type="number" formControlName="quantityReturned" />
      <app-input-field label="Returned By *" formControlName="returnedBy" />
      <app-select-input
        label="Returned Item Status *"
        formControlName="itemStatus"
        [options]="itemStatusOptions"
      />
      <app-textarea-input label="Return Remarks *" [rows]="3" formControlName="remarks" />
    </form>

    <div class="obs-modal__actions">
      <button type="button" class="btn-secondary" (click)="closeModal()">Close</button>
      <button type="button" class="btn-primary" [disabled]="saving()" (click)="submitReturn()">
        {{ saving() ? "Submitting..." : "Submit" }}
      </button>
    </div>
  </app-modal>
}
