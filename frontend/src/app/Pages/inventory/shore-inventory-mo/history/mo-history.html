<app-obs-help-guidance />

<div class="glass-card mo-panel">
  <div class="mo-panel__header">
    <h3>History</h3>
  </div>

  <div class="mo-tabs-row">
    <button type="button" class="mo-tab-btn" [class.mo-tab-btn--active]="activeTab() === 'normal'" (click)="selectTab('normal')">
      Normal Demands
    </button>
    <button type="button" class="mo-tab-btn" [class.mo-tab-btn--active]="activeTab() === 'pts'" (click)="selectTab('pts')">
      PTS Demands
    </button>
    <button type="button" class="mo-tab-btn" [class.mo-tab-btn--active]="activeTab() === 'rio'" (click)="selectTab('rio')">
      RIO Demands
    </button>
    <button type="button" class="mo-tab-btn" [class.mo-tab-btn--active]="activeTab() === 'iif'" (click)="selectTab('iif')">
      IIF
    </button>
  </div>

  <app-data-grid [rowData]="rows()" [columnDefs]="columnDefs()" height="420px" />
</div>
