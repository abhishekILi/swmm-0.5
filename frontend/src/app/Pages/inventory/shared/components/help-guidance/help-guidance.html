<div class="help-guidance glass-card">
  <button type="button" class="help-guidance__toggle" (click)="toggle()">
    <span class="help-guidance__title">
      <app-icon name="info" [size]="16" variant="accent" />
      Help &amp; Guidance
    </span>
    <app-icon
      name="chevron-down"
      [size]="16"
      variant="inherit"
      [style.transform]="expanded() ? 'rotate(180deg)' : 'rotate(0deg)'"
    />
  </button>

  @if (expanded()) {
    <div class="help-guidance__body">
      @if (bodyHtml()) {
        <div [innerHTML]="bodyHtml()"></div>
      } @else {
        <p class="help-guidance__placeholder">Guidance for this page is being prepared.</p>
      }
    </div>
  }
</div>
