<div class="min-h-[75vh] flex items-center justify-center p-6">
    <div
        class="glass-card p-10 text-center max-w-xl w-full space-y-6 border border-white/15 rounded-2xl shadow-2xl relative overflow-hidden">
        <!-- Ambient Glow Backlight -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- Navy Anchor Icon -->
        <div class="relative z-10 flex items-center justify-center">
            <div
                class="w-20 h-20 rounded-2xl bg-sky-500/10 border border-sky-500/30 flex items-center justify-center shadow-lg shadow-sky-500/10 text-sky-400">
                <app-icon name="anchor" [size]="44" variant="inherit"></app-icon>
            </div>
        </div>

        <!-- Title & Subtitle -->
        <div class="relative z-10 space-y-2 p-2">
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-wide">
                {{ title }}
            </h1>
            <p class="text-xs md:text-sm text-white/70 max-w-md mx-auto leading-relaxed">
                {{ subtitle }}
            </p>
        </div>

        <!-- Custom Interactive Progress Bar matching reference design -->
        <div class="relative z-10 space-y-3 px-2">
            <div class="custom-progress">
                <div class="progress-fill" [style.width.%]="progressWidth()"></div>
            </div>
            <p class="loading-text font-medium tracking-widest text-sky-400 text-sm animate-pulse">
                Loading . . . .
            </p>
        </div>

        <!-- Contact Info Footer -->
        <div class="relative z-10 pt-4 border-t border-white/10">
            <p class="text-xs text-white/50">
                For updates or inquiries, contact our team
            </p>
        </div>
    </div>
</div>
