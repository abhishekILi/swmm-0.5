@switch (type) {
  @case ("donut") {
    <div class="c-donut">
      <app-donut-chart
        [segments]="segments"
        centerValue="{{ donutTotal }}"
        [centerLabel]="data.centerLabel || 'Total'"
        [width]="130"
        [height]="130"
      />
      <div class="c-legend">
        @for (s of segments; track s.label) {
          <div class="c-legend-row">
            <span class="c-legend-dot" [style.background]="s.color"></span>
            <span class="c-legend-label">{{ s.label }}</span>
            <span class="c-legend-value">{{ s.value }}</span>
          </div>
        }
      </div>
    </div>
  }

  @case ("line") {
    <app-line-chart
      [series]="series"
      [labels]="data.labels || []"
      [xAxisTitle]="data.xAxisTitle || ''"
      [yAxisTitle]="data.yAxisTitle || ''"
    />
  }

  @case ("bar") {
    <app-bar-chart [data]="barData" [showAxes]="false" [heightPx]="180" />
  }

  @case ("hbar") {
    <app-bar-chart [data]="barData" orientation="horizontal" [showAxes]="false" [heightPx]="hbarHeightPx" />
  }

  @case ("gauge") {
    <app-gauge-chart
      [value]="gaugeValue"
      [color]="data.color || '#22C55E'"
      [centerText]="gaugeValue + '%'"
      [label]="data.unit || 'Exposure'"
      [heightPx]="150"
    />
  }

  @case ("stat") {
    <div class="c-stat">
      <span class="c-stat-val" [style.color]="data.color || 'var(--text-primary)'">{{ data.value }}</span>
      @if (data.unit) {
        <span class="c-stat-unit">{{ data.unit }}</span>
      }
    </div>
  }
}
