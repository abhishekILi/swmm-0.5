<div class="overlay">

  <div class="glass-popup">

    <!-- HEADER -->
    <div class="header">
      <h3>Select Date</h3>

      <button class="close-btn" (click)="close()">
        ✕
      </button>
    </div>

    <!-- PICKERS -->
    <div class="pickers">

      <div class="picker-wrapper">
        <ion-datetime
          class="wheel-picker"
          presentation="date"
          prefer-wheel="true"
          [(ngModel)]="fromDate">
        </ion-datetime>
      </div>

      <div class="to-text">to</div>

      <div class="picker-wrapper">
        <ion-datetime
          class="wheel-picker"
          presentation="date"
          prefer-wheel="true"
          [(ngModel)]="toDate">
        </ion-datetime>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">

      <button
        class="footer-btn secondary"
        (click)="close()">
        Close
      </button>

      <button
        class="footer-btn primary"
        (click)="applyDateRange()">
        Select
      </button>

    </div>

  </div>

</div>
