<div class="radio-group">

  <label for="label" class="radio-label">
    {{ label }}
  </label>

  <div class="radio-options">

    @for(option of options; track option.value){

      <label class="radio-option">

        <input
          type="radio"
          [checked]="value === option.value"
          (change)="select(option.value)"
        >

        {{ option.label }}

      </label>

    }

  </div>

</div>
