build_backend:
  extends:
    - .dev_job
    - .default_dev_rules

  stage: build

  script:
    - |
      docker buildx build \
      --no-cache \
      --pull \
      --load \
      -t swmm-backend:${CI_COMMIT_SHORT_SHA} \
      backend

build_frontend:
  extends:
    - .dev_job
    - .default_dev_rules

  stage: build

  script:
    - |
      docker buildx build \
      -f frontend/Dockerfile \
      --no-cache \
      --pull \
      --load \
      -t swmm-frontend:${CI_COMMIT_SHORT_SHA} \
      .

push_harbor:
  extends:
    - .dev_job
    - .default_dev_rules

  stage: push

  needs:
    - build_backend
    - build_frontend

  before_script:
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin

  script:
    - docker tag swmm-backend:${CI_COMMIT_SHORT_SHA} $HARBOR_URL/$HARBOR_PROJECT/backend:${CI_COMMIT_SHORT_SHA}
    - docker tag swmm-backend:${CI_COMMIT_SHORT_SHA} $HARBOR_URL/$HARBOR_PROJECT/backend:dev
    - docker tag swmm-frontend:${CI_COMMIT_SHORT_SHA} $HARBOR_URL/$HARBOR_PROJECT/frontend:${CI_COMMIT_SHORT_SHA}
    - docker tag swmm-frontend:${CI_COMMIT_SHORT_SHA} $HARBOR_URL/$HARBOR_PROJECT/frontend:dev

    - docker push $HARBOR_URL/$HARBOR_PROJECT/backend:${CI_COMMIT_SHORT_SHA}
    - docker push $HARBOR_URL/$HARBOR_PROJECT/backend:dev
    - docker push $HARBOR_URL/$HARBOR_PROJECT/frontend:${CI_COMMIT_SHORT_SHA}
    - docker push $HARBOR_URL/$HARBOR_PROJECT/frontend:dev

    - docker logout
