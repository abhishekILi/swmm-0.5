deploy_dev:
  extends:
    - .dev_job
    - .default_dev_rules

  stage: deploy

  environment:
    name: dev

  script:
    - chmod +x scripts/deploy_dev.sh
    - ./scripts/deploy_dev.sh


deploy_offline:
  extends:
    - .offline_deploy_job
    - .default_dev_rules

  stage: deploy_offline

  environment:
    name: offline-dev

  script:
    - chmod +x scripts/deploy_offline.sh
    - ./scripts/deploy_offline.sh

